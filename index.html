<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;
font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",sans-serif;
background:#f5f5f7;
color:#222
}
header{height:58px;padding:17px 16px 8px;text-align:center;font-size:22px;font-weight:700;position:relative}
.settings{position:absolute;right:14px;top:13px;border:0;background:transparent;font-size:22px;padding:5px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:none;background:#e5e5ea;color:#555;padding:8px 15px;border-radius:18px;font-size:14px;white-space:nowrap}
.tab.active{background:#222;color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;padding:12px}
.item{text-align:center;user-select:none;touch-action:manipulation}
.icon{
width:58px;
height:58px;
margin:0 auto 6px;
border-radius:15px;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
line-height:1;
box-shadow:0 2px 8px rgba(0,0,0,.08);
flex:0 0 58px
}
.name{
width:100%;
height:18px;
line-height:18px;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
padding:0 3px
}
.add{cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:#999;padding:50px 20px;font-size:14px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{width:100%;max-width:380px;max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:20px}
.modal h2{margin:0 0 18px;font-size:20px}
.modal input,.modal select{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
background:white
}
.emoji-list{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.emoji-button{border:none;background:#f2f2f7;border-radius:10px;font-size:24px;padding:8px}
.emoji-button.selected{background:#dbeeff}
.icon-input-note{font-size:12px;color:#888;margin:-4px 0 12px}
.buttons{display:flex;gap:8px}
.buttons button,.manage-buttons button,.settings-list button{border:none;border-radius:12px;padding:13px;font-size:15px}
.buttons button{flex:1}
.cancel,.close{background:#e5e5ea}
.save,.edit-link{background:#007aff;color:white}
.delete,.delete-link{background:#ff3b30;color:white}
.manage-buttons,.settings-list{display:flex;flex-direction:column;gap:8px}
.change-category,.sort-link,.category-add{background:#e5e5ea}
.sort-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.sort-icon{font-size:26px;width:42px;text-align:center}
.sort-name{flex:1;font-size:15px}
.arrow{width:42px;background:#e5e5ea}
.category-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.category-name{flex:1;font-size:15px}
.category-row button{border:none;border-radius:9px;padding:8px 10px}
.category-edit{background:#e5e5ea}
.category-delete{background:#ff3b30;color:white}
.note{font-size:12px;color:#888;margin:-8px 0 14px}
</style>
</head>

<body>

<header>
My Links
<button class="settings" id="settingsButton">⚙️</button>
</header>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<!-- リンク管理 -->
<div class="overlay" id="manageOverlay">
<div class="modal">
<h2>リンクを管理</h2>
<div class="manage-buttons">
<button class="edit-link" id="editButton">編集</button>
<button class="change-category" id="categoryButton">カテゴリ変更</button>
<button class="sort-link" id="sortLinkButton">並べ替え</button>
<button class="delete-link" id="manageDeleteButton">削除</button>
<button class="close" id="closeManageButton">キャンセル</button>
</div>
</div>
</div>

<!-- リンク編集 -->
<div class="overlay" id="editOverlay">
<div class="modal">
<h2 id="modalTitle">リンクを追加</h2>

<div class="emoji-list" id="emojiList"></div>

<input id="iconInput" type="text" maxlength="8" placeholder="好きな絵文字を入力（例：🏠）">
<div class="icon-input-note">候補から選ぶことも、iPhoneの絵文字キーボードから直接入力することもできます。</div>

<input id="nameInput" type="text" placeholder="名前">
<input id="urlInput" type="url" placeholder="https://example.com">
<select id="categoryInput"></select>

<div class="buttons">
<button class="cancel" id="cancelButton">キャンセル</button>
<button class="save" id="saveButton">保存</button>
</div>

<button class="delete" id="deleteButton" style="display:none;width:100%;margin-top:8px">削除</button>
</div>
</div>

<!-- 設定 -->
<div class="overlay" id="settingsOverlay">
<div class="modal">
<h2>設定</h2>
<div class="settings-list">
<button class="category-add" id="addCategoryButton">＋ カテゴリを追加</button>
<button class="sort-link" id="globalSortButton">リンクを並べ替える</button>
<button class="close" id="closeSettingsButton">閉じる</button>
</div>

<div style="margin-top:22px">
<h3 style="font-size:16px;margin:0 0 8px">カテゴリ</h3>
<div id="categoryList"></div>
</div>

</div>
</div>

<!-- 並べ替え -->
<div class="overlay" id="sortOverlay">
<div class="modal">
<h2>リンクを並べ替え</h2>
<p class="note">↑ ↓ を押して順番を変更できます。</p>
<div id="sortList"></div>
<button class="close" id="closeSortButton" style="width:100%;margin-top:14px">完了</button>
</div>
</div>

<script>

const defaultLinks=[
{id:1,name:"Google",url:"https://www.google.com",icon:"🔍",category:"仕事"},
{id:2,name:"YouTube",url:"https://www.youtube.com",icon:"▶️",category:"趣味"},
{id:3,name:"GitHub",url:"https://github.com",icon:"🐙",category:"仕事"},
{id:4,name:"Apple",url:"https://www.apple.com",icon:"🍎",category:"買い物"}
];

const emojiChoices=[
"🔍","▶️","🐙","🍎","🌐","📱","💻","📷",
"🎵","🎮","🛒","🏠","💼","📚","✈️","🍔",
"🏦","💰","📰","⭐","❤️","🔧","📁","🔗"
];

let links=JSON.parse(localStorage.getItem("myLinks"));
if(!links){
links=defaultLinks;
saveLinks();
}

let categories=JSON.parse(localStorage.getItem("myCategories"));
if(!categories){
categories=["すべて","仕事","趣味","買い物"];
saveCategories();
}
else if(!categories.includes("すべて")){
categories.unshift("すべて");
saveCategories();
}

let currentCategory="すべて";
let selectedEmoji="🔗";
let editingId=null;
let managingId=null;

const grid=document.getElementById("grid");
const tabs=document.getElementById("tabs");
const manageOverlay=document.getElementById("manageOverlay");
const editOverlay=document.getElementById("editOverlay");
const settingsOverlay=document.getElementById("settingsOverlay");
const sortOverlay=document.getElementById("sortOverlay");

function saveLinks(){
localStorage.setItem("myLinks",JSON.stringify(links));
}

function saveCategories(){
localStorage.setItem("myCategories",JSON.stringify(categories));
}

function renderTabs(){

tabs.innerHTML="";

categories.forEach(category=>{

const b=document.createElement("button");

b.className="tab"+(category===currentCategory?" active":"");

b.textContent=category;

b.onclick=()=>{
currentCategory=category;
renderTabs();
renderLinks();
};

tabs.appendChild(b);

});

}

function renderLinks(){

grid.innerHTML="";

const visible=links.filter(
l=>currentCategory==="すべて"||l.category===currentCategory
);

if(visible.length===0){

const empty=document.createElement("div");

empty.className="empty";

empty.textContent="このカテゴリにはリンクがありません";

grid.appendChild(empty);

}

visible.forEach(link=>{

const item=document.createElement("div");

item.className="item";

item.innerHTML=
'<div class="icon">'+escapeHtml(link.icon)+'</div>'+
'<div class="name">'+escapeHtml(link.name)+'</div>';

let timer=null;
let longPressed=false;

item.addEventListener("touchstart",()=>{

longPressed=false;

timer=setTimeout(()=>{
longPressed=true;
openManage(link.id);
},600);

},{passive:true});

item.addEventListener("touchend",e=>{

clearTimeout(timer);

if(longPressed){
e.preventDefault();
return;
}

window.open(link.url,"_blank");

});

item.addEventListener(
"touchmove",
()=>clearTimeout(timer),
{passive:true}
);

item.onclick=()=>{};

grid.appendChild(item);

});

const add=document.createElement("div");

add.className="item add";

add.innerHTML=
'<div class="icon">＋</div>'+
'<div class="name">追加</div>';

add.onclick=()=>openEdit(null);

grid.appendChild(add);

}

function escapeHtml(text){

const d=document.createElement("div");

d.textContent=text;

return d.innerHTML;

}

function openManage(id){

managingId=id;

manageOverlay.classList.add("show");

}

document.getElementById("closeManageButton").onclick=()=>{
manageOverlay.classList.remove("show");
};

document.getElementById("editButton").onclick=()=>{

manageOverlay.classList.remove("show");

openEdit(managingId);

};

document.getElementById("categoryButton").onclick=()=>{

manageOverlay.classList.remove("show");

openEdit(managingId);

setTimeout(()=>{
document.getElementById("categoryInput").focus();
},100);

};

document.getElementById("sortLinkButton").onclick=()=>{

manageOverlay.classList.remove("show");

openSort();

};

document.getElementById("manageDeleteButton").onclick=()=>{

const link=links.find(l=>l.id===managingId);

if(!link)return;

if(!confirm("「"+link.name+"」を削除しますか？"))return;

links=links.filter(l=>l.id!==managingId);

saveLinks();

manageOverlay.classList.remove("show");

renderLinks();

};

function renderEmojiChoices(){

const box=document.getElementById("emojiList");

box.innerHTML="";

emojiChoices.forEach(emoji=>{

const b=document.createElement("button");

b.className=
"emoji-button"+(emoji===selectedEmoji?" selected":"");

b.textContent=emoji;

b.onclick=()=>{

selectedEmoji=emoji;

document.getElementById("iconInput").value=emoji;

renderEmojiChoices();

};

box.appendChild(b);

});

}

function renderCategorySelect(){

const select=document.getElementById("categoryInput");

select.innerHTML="";

categories
.filter(c=>c!=="すべて")
.forEach(c=>{

const o=document.createElement("option");

o.value=c;

o.textContent=c;

select.appendChild(o);

});

}

function openEdit(id){

editingId=id;

renderCategorySelect();

const del=document.getElementById("deleteButton");

if(id===null){

document.getElementById("modalTitle").textContent="リンクを追加";

document.getElementById("nameInput").value="";

document.getElementById("urlInput").value="";

selectedEmoji="🔗";

document.getElementById("iconInput").value="";

if(categories.length>1){

document.getElementById("categoryInput").value=categories[1];

}

del.style.display="none";

}
else{

const link=links.find(l=>l.id===id);

if(!link)return;

document.getElementById("modalTitle").textContent="リンクを編集";

document.getElementById("nameInput").value=link.name;

document.getElementById("urlInput").value=link.url;

selectedEmoji=link.icon;

document.getElementById("iconInput").value=link.icon;

document.getElementById("categoryInput").value=link.category;

del.style.display="block";

}

renderEmojiChoices();

editOverlay.classList.add("show");

}

document.getElementById("cancelButton").onclick=()=>{
editOverlay.classList.remove("show");
};

document.getElementById("saveButton").onclick=()=>{

const name=document.getElementById("nameInput").value.trim();

const url=document.getElementById("urlInput").value.trim();

const category=document.getElementById("categoryInput").value;

const typedIcon=document.getElementById("iconInput").value.trim();

if(typedIcon){
selectedEmoji=typedIcon;
}

if(!name||!url){

alert("名前とURLを入力してください");

return;

}

if(editingId===null){

links.push({
id:Date.now(),
name:name,
url:url,
icon:selectedEmoji,
category:category
});

}
else{

const link=links.find(l=>l.id===editingId);

if(link){

link.name=name;
link.url=url;
link.icon=selectedEmoji;
link.category=category;

}

}

saveLinks();

editOverlay.classList.remove("show");

renderLinks();

};

document.getElementById("deleteButton").onclick=()=>{

const link=links.find(l=>l.id===editingId);

if(!link)return;

if(!confirm("「"+link.name+"」を削除しますか？"))return;

links=links.filter(l=>l.id!==editingId);

saveLinks();

editOverlay.classList.remove("show");

renderLinks();

};

/* 設定 */

document.getElementById("settingsButton").onclick=()=>{

renderCategoryList();

settingsOverlay.classList.add("show");

};

document.getElementById("closeSettingsButton").onclick=()=>{
settingsOverlay.classList.remove("show");
};

document.getElementById("addCategoryButton").onclick=()=>{

const name=prompt("新しいカテゴリ名を入力してください");

if(!name)return;

const trimmed=name.trim();

if(!trimmed||trimmed==="すべて")return;

if(categories.includes(trimmed)){

alert("そのカテゴリはすでにあります");

return;

}

categories.push(trimmed);

saveCategories();

renderCategoryList();

renderTabs();

};

function renderCategoryList(){

const box=document.getElementById("categoryList");

box.innerHTML="";

categories
.filter(c=>c!=="すべて")
.forEach(category=>{

const row=document.createElement("div");

row.className="category-row";

const name=document.createElement("div");

name.className="category-name";

name.textContent=category;

const edit=document.createElement("button");

edit.className="category-edit";

edit.textContent="編集";

edit.onclick=()=>editCategory(category);

const del=document.createElement("button");

del.className="category-delete";

del.textContent="削除";

del.onclick=()=>deleteCategory(category);

row.append(name,edit,del);

box.appendChild(row);

});

}

function editCategory(oldName){

const newName=prompt("カテゴリ名を変更",oldName);

if(!newName)return;

const trimmed=newName.trim();

if(
!trimmed||
trimmed==="すべて"||
trimmed===oldName
)return;

if(categories.includes(trimmed)){

alert("そのカテゴリはすでにあります");

return;

}

const index=categories.indexOf(oldName);

if(index!==-1){
categories[index]=trimmed;
}

links.forEach(link=>{

if(link.category===oldName){
link.category=trimmed;
}

});

if(currentCategory===oldName){
currentCategory=trimmed;
}

saveCategories();

saveLinks();

renderCategoryList();

renderTabs();

renderLinks();

}

function deleteCategory(name){

const count=links.filter(l=>l.category===name).length;

let message="「"+name+"」を削除しますか？";

if(count>0){

message+="\n\nこのカテゴリのリンクが"+count+"件あります。";

message+="\n削除すると、そのリンクは別のカテゴリへ移動します。";

}

if(!confirm(message))return;

if(count>0){

const other=categories.find(
c=>c!=="すべて"&&c!==name
);

if(!other){

alert(
"削除できません。別のカテゴリを1つ作ってから削除してください。"
);

return;

}

links.forEach(link=>{

if(link.category===name){
link.category=other;
}

});

}

categories=categories.filter(c=>c!==name);

if(currentCategory===name){
currentCategory="すべて";
}

saveCategories();

saveLinks();

renderCategoryList();

renderTabs();

renderLinks();

}

/* 並べ替え */

function openSort(){

renderSortList();

sortOverlay.classList.add("show");

}

document.getElementById("globalSortButton").onclick=()=>{

settingsOverlay.classList.remove("show");

openSort();

};

document.getElementById("closeSortButton").onclick=()=>{

sortOverlay.classList.remove("show");

renderLinks();

};

function renderSortList(){

const box=document.getElementById("sortList");

box.innerHTML="";

links.forEach((link,index)=>{

const row=document.createElement("div");

row.className="sort-row";

const icon=document.createElement("div");

icon.className="sort-icon";

icon.textContent=link.icon;

const name=document.createElement("div");

name.className="sort-name";

name.textContent=link.name;

const up=document.createElement("button");

up.className="arrow";

up.textContent="↑";

up.disabled=index===0;

up.onclick=()=>moveLink(index,index-1);

const down=document.createElement("button");

down.className="arrow";

down.textContent="↓";

down.disabled=index===links.length-1;

down.onclick=()=>moveLink(index,index+1);

row.append(icon,name,up,down);

box.appendChild(row);

});

}

function moveLink(from,to){

if(to<0||to>=links.length)return;

const temp=links[from];

links[from]=links[to];

links[to]=temp;

saveLinks();

renderSortList();

renderLinks();

}

renderTabs();

renderLinks();

</script>

</body>
</html>
