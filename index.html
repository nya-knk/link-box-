<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      background: #f5f5f7;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    h1 {
      font-size: 24px;
      margin: 10px 4px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 10px;
    }

    .link {
      text-decoration: none;
      color: #222;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 7px;
      border-radius: 15px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 12px;
      line-height: 1.3;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>My Links</h1>

  <div class="grid">

    <a class="link" href="https://www.google.com/" target="_blank">
      <div class="icon">🔍</div>
      <div class="name">Google</div>
    </a>

    <a class="link" href="https://www.youtube.com/" target="_blank">
      <div class="icon">▶️</div>
      <div class="name">YouTube</div>
    </a>

    <a class="link" href="https://github.com/" target="_blank">
      <div class="icon">🐙</div>
      <div class="name">GitHub</div>
    </a>

    <a class="link" href="https://www.apple.com/jp/" target="_blank">
      <div class="icon">🍎</div>
      <div class="name">Apple</div>
    </a>

  </div>

</body>
</html>
